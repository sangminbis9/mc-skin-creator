name: App Store TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'app-store/**'
      - '.github/workflows/app-store-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    defaults:
      run:
        shell: bash
        working-directory: app-store
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check signing and upload configuration
        id: credentials
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 != '' }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD != '' }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          missing=()
          for name in APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            [[ "${!name}" == true ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 6 )); then
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No TestFlight secrets configured. This run validates an unsigned iPhone archive.'
          elif (( ${#missing[@]} > 0 )); then
            printf '::error::Missing TestFlight secret %s\n' "${missing[@]}"
            exit 1
          else
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-store/package-lock.json

      - name: Check Xcode and distribution options
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          help=$(xcodebuild -help 2>&1)
          for option in app-store-connect testFlightInternalTestingOnly authenticationKeyPath; do
            if ! grep -Fq "$option" <<< "$help"; then
              echo "::error::The runner's Xcode does not support $option."
              exit 1
            fi
          done

      - run: npm ci
      - run: npm test
      - run: npm run ios:sync

      - name: Install Apple distribution identity and profile
        if: steps.credentials.outputs.upload == 'true'
        env:
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          signing="$RUNNER_TEMP/testflight-signing"
          mkdir -p "$signing"
          trap 'rm -f "$signing/distribution.p12" "$signing/app.mobileprovision" "$signing/profile.plist"' EXIT
          printf '%s' "$DISTRIBUTION_P12" | base64 -D > "$signing/distribution.p12"
          printf '%s' "$PROVISIONING_PROFILE" | base64 -D > "$signing/app.mobileprovision"
          security cms -D -i "$signing/app.mobileprovision" > "$signing/profile.plist"

          keychain="$signing/distribution.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing/distribution.p12" -k "$keychain" -f pkcs12 \
            -P "$DISTRIBUTION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          # The helper validates the profile and writes the export options for this app.
          profile_uuid=$(python3 scripts/prepare-testflight-signing.py "$signing" "$keychain")
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$signing/app.mobileprovision" "$profiles/$profile_uuid.mobileprovision"

      - name: Archive iPhone Release build
        env:
          UPLOAD: ${{ steps.credentials.outputs.upload }}
        run: |
          build_number="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          archive="$RUNNER_TEMP/SkinStudio.xcarchive"
          signing_settings=(CODE_SIGNING_ALLOWED=NO)
          if [[ "$UPLOAD" == true ]]; then
            signing_settings=(
              CODE_SIGN_STYLE=Manual
              "DEVELOPMENT_TEAM=$APP_STORE_TEAM_ID"
              "CODE_SIGN_IDENTITY=Apple Distribution"
              "APP_STORE_PROFILE_UUID=$APP_STORE_PROFILE_UUID"
            )
          fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            "CURRENT_PROJECT_VERSION=$build_number" "${signing_settings[@]}" archive
          echo "Archived iOS build $build_number." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UPLOAD" == false ]]; then
            echo 'Unsigned archive validated. Add the six testflight environment secrets to enable upload.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to App Store Connect for internal TestFlight
        if: steps.credentials.outputs.upload == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          umask 077
          signing="$RUNNER_TEMP/testflight-signing"
          api_key_path="$signing/AuthKey.p8"
          trap 'rm -f "$api_key_path"' EXIT
          printf '%s\n' "$API_PRIVATE_KEY" > "$api_key_path"
          unset API_PRIVATE_KEY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SkinStudio.xcarchive" \
            -exportPath "$RUNNER_TEMP/testflight-export" \
            -exportOptionsPlist "$signing/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$api_key_path" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          echo 'Uploaded to App Store Connect. Apple processes the build before it appears in TestFlight.' >> "$GITHUB_STEP_SUMMARY"
